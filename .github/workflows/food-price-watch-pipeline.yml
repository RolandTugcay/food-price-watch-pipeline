name: FoodPriceWatch_Pipeline

on:
  schedule:
    # Every Tuesday at 12:00 AM Manila time
    - cron: "0 16 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FoodPriceWatch pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python src/run_pipeline.py

      - name: Get finished date
        id: get_date
        run: echo "FINISHED_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV

      - name: Send finished date to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 1. Generate the current ISO 8601 timestamp
          FINISHED_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # 2. Send the API request to Supabase
          curl -X POST "$SUPABASE_URL/github_runs" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{
              "github_run_id": "${{ github.run_id }}",
              "finished_at": "'"$FINISHED_DATE"'",
              "status": "${{ job.status }}"
            }'